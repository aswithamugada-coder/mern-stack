<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color:rgb(142, 50, 228);
            width: 50vw;
            height: 80vh;
        }
        .box.box{
            background-color: rgb(20, 20, 20);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-left:auto;
            
        }
        .item{
            display:flex;
            justify-content:space-between;
            width: 80vw;
            margin: 20px auto;
        }
        .boxa{
            background-color: rgb(20, 20, 20);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left:auto;
            animation-name: myanimation;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function:ease-in-out;
            animation-delay: 2s;
            animation-direction: alternate;  
        }
        @keyframes myanimation{
            from{
                background-color: rgb(22, 4, 185);
            }
            to{
                transform:translateX(0vw);
                transform:translateY(80vh);
                transform: rotate(0deg);
                background-color: rgb(255, 255, 255);
            }
        }
            @keyframes myanimation{
                0%{
                    transform: translateX(0vw) translateY(100vh) rotate(0deg);
                    background-color: rgb(22, 4, 185);
                }
                100%{
                    transform: translateX(80px) translateY(0px) rotate(360deg);
                    background-color: rgb(209, 24, 24);
                }

            }
        
    </style>
</head>
<body>
    <div class="item">
        <div class="box boxa"></div>
        <div class="box boxb"></div>
        <div class="box boxa"></div>
        <div class="box boxb"></div>
        <div class="box boxa"></div>
        <div class="box boxb"></div>
        <div class="box boxa"></div>
        <div class="box boxb"></div>

    </div>
</body>
</html>
