<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow and Text Shadow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px red;
            margin-bottom: 28px;
        }
        .box1{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px red;
        }
        .text-shadow{
            text-shadow: 5px 15px 5px blue;

        }

    </style>
</head>
<body>
    <div class="box">
        I am a box.
    </div>
    <div class="box1">
        I am a box1.
    </div>
    <br>
    <p class="text-shadow">
    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Similique corrupti rerum odio sit beatae iste, consectetur nemo aspernatur! Laudantium modi ratione ipsum, quas nisi dolorum. Quam sed assumenda laudantium odio?</p>
</body>
</html>
