<html lang="en">

    <title>User data collection</title>
</head>

<body>
    <h1>User data collection</h1>
    <form action="post">
        <div>
            <label for="username">username: </label>
            <input id="username" type="text" name="username" placeholder="Enter your full name" required>
        </div>
        <div>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female: </label>

        </div>
        <div>
            <label for="mobile no">mobile no: </label>
            <input id="mobile" type="tel" name="enter your mobile no" placeholder="Enter your mobile no" pattern="[0-9]{10}" required>
        </div>
        <div>
            <label for="Gmail">Gmail: </label>
            <input id="email" type="email" name="enter your mail" placeholder="example@aswi.gmail.com" required>
        </div>
        <div>
            <label for="password">paswords: </label>
            <input id="password" type="text" name="enter your passsword" placeholder="Enter your passsword" minlength="8" required>
        </div>
        <input type="submit" value="submit">



        <div>


</body>
