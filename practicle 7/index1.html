<!DOCTYPE html>7
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css box model</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: aquamarine;
        }
        .box1{
            color: blueviolet;
            padding: 10px;
            margin: 35px;
            border: 2px solid  blue;
            height:200px;
            box-sizing:border-box;
        }
        *{
            margin: 0;
            padding: 0;
        }
        .box2{
            background-color: rgb(102, 255, 0);
        }
        .box2{
            color: blueviolet;
            padding: 24px;
            margin: 30px;
            border: 3px solid  blue;
            height: 260px;
            width: 500px;
            box-sizing:border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">
        I am a box
    </div>  
    <div class="box2 box">
        I am another box
    </div> 
</body>
</html>
