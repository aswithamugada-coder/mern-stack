<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
            background-color:rgb(236, 233, 180);
            height: 83px;
        }
        main{
            background-color:rgb(188, 231, 171);
            color:rgb(2, 8, 14);
            padding:34px;
            text-align:center;
        }
        .container{
            background-color:rgb(12, 122, 104);
            margin: 12px  34px;
            padding:55px 23px;
            text-align:center;
        }
        .box1{
            background-color:rgb(160, 155, 182);
            height: 70vh;
            width: 45%;
            margin:0px 12px;
            display:inline-block;
        }
        .box2{
            background-color:rgb(54, 151, 146);
            height: 70vh;
            width: 45%;
            margin:0px 12px;
            display:inline-block;
        }
        .text-box{
            padding: 34px;
            border: 2px solid rgb(2, 5, 36);
            margin: 50px 34vw;
            font-size:2em;
            border-radius: 13px;
        }
        .orange-box{
            background:orange;
            height:32px;
            width:32px;
            position:fixed;
            bottom:12px;
            right: 23px;
            border-radius: 60px;
        }
        footer{
            background-color:rgb(194, 186, 42);
            height: 100px;
        }
        nav ul{
            display:flex;
            color: rgb(48, 10, 218);
            list-style-type:none;
            margin: 34px;
            padding: 34px;
            gap: 34px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
           <ul>
               <li>Home</li>
               <li>About</li>
               <li>Contact</li>
           </ul>  
        </nav>
    </header>
    <main>
        <h1>This is a layout page</h1>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="text-box">
                <p>welcome to my world gedela gayatri</p>
            </div>
        </div>
        <div class="orange-box">

        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
